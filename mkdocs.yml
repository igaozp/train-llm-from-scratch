site_name: Train LLM From Scratch
site_description: From pretraining to RLHF/GRPO — every algorithm hand-written in pure PyTorch.
site_url: https://FareedKhan-dev.github.io/train-llm-from-scratch/
repo_url: https://github.com/FareedKhan-dev/train-llm-from-scratch
repo_name: FareedKhan-dev/train-llm-from-scratch
docs_dir: docs
# Files present under docs/ but intentionally not page nodes in the nav.
not_in_nav: |
  /diagrams/README.md
  /diagrams/README_zh.md
# Keep the raw mermaid sources out of the built site.
exclude_docs: |
  /diagrams/src/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]          # so howto/commands.md can include the root POST_TRAINING.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js   # live hand-drawn mermaid in <details>
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: README.md
  - 中文文档:
      - 首页: README_zh.md
      - 基础知识:
          - 概览: foundations/README_zh.md
          - 分词与数据形状: foundations/tokenization_zh.md
          - 仅解码器 Transformer: foundations/transformer_zh.md
          - 注意力、掩码与头: foundations/attention_zh.md
          - 目标函数、损失与困惑度: foundations/objectives_zh.md
          - 优化与训练系统: foundations/optimization_zh.md
          - 生成与采样: foundations/generation_zh.md
      - 理论与流水线:
          - 数据处理: 01_data_pipeline_zh.md
          - 预训练: 02_pretraining_zh.md
          - SFT: 03_sft_zh.md
          - 奖励模型: 04_reward_model_zh.md
          - DPO / ORPO / KTO: 05_dpo_zh.md
          - PPO: 06_ppo_zh.md
          - GRPO / RLVR: 07_grpo_zh.md
      - 使用指南:
          - JSON 配置: howto/configs_zh.md
          - 训练（UI 与 CLI）: howto/train_zh.md
          - 控制面板 UI: howto/ui_zh.md
          - 评估: 08_evaluation_zh.md
          - 推理 / 对话: 09_inference_zh.md
      - 参考:
          - 命令速查表: howto/commands_zh.md
  - Foundations:
      - Overview: foundations/README.md
      - Tokenization & Data Shapes: foundations/tokenization.md
      - Decoder-Only Transformer: foundations/transformer.md
      - Attention, Masks & Heads: foundations/attention.md
      - Objectives, Losses & Perplexity: foundations/objectives.md
      - Optimization & Training Systems: foundations/optimization.md
      - Generation & Sampling: foundations/generation.md
  - Theory & Pipeline:
      - Data handling: 01_data_pipeline.md
      - Pretraining: 02_pretraining.md
      - SFT: 03_sft.md
      - Reward Model: 04_reward_model.md
      - DPO / ORPO / KTO: 05_dpo.md
      - PPO: 06_ppo.md
      - GRPO / RLVR: 07_grpo.md
  - How-to:
      - Configure (JSON): howto/configs.md
      - Train (UI & CLI): howto/train.md
      - The control-panel UI: howto/ui.md
      - Evaluate: 08_evaluation.md
      - Inference / Chat: 09_inference.md
  - Reference:
      - Command cheatsheet: howto/commands.md
